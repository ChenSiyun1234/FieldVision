<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FieldVision</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <button class="brand" id="home" title="Choose who you are"><span class="dot silage"></span><span class="dot grain"></span>FieldVision</button>
    <nav id="tabs" class="tabs" aria-label="Views"></nav>
    <div class="top-right">
      <div id="status" class="chips" aria-live="polite"></div>
      <button id="switch-role" class="ghost small" hidden>Switch role</button>
    </div>
  </header>

  <!-- Who are you? -->
  <main id="landing" class="landing">
    <h1>Which corn was chopped for silage, and which was combined for grain?</h1>
    <p class="lede">FieldVision reads public Sentinel-2 imagery field by field. Pick who you are.</p>
    <div class="roles">
      <button class="role-card" data-role="dairy">
        <span class="role-icon" aria-hidden="true">🐄</span>
        <span class="role-title">I run a dairy</span>
        <span class="role-text">Find standing corn near you that you could still buy and chop: tons, haul distance and a delivered price range, on a map.</span>
      </button>
      <button class="role-card" data-role="usda">
        <span class="role-icon" aria-hidden="true">📊</span>
        <span class="role-title">I'm a USDA analyst</span>
        <span class="role-text">Run counties through the agent, read the evidence and report, plan field visits, and see corn supply, stocks and price next to our silage estimates.</span>
      </button>
    </div>
    <p class="muted small">Acres here are model estimates, not NASS statistics. Field data covers past seasons, so the dairy view replays a season as of a date.</p>
  </main>

  <div id="workspace" class="workspace" hidden>
    <aside id="side" class="side"></aside>
    <section id="view" class="view"></section>
  </div>

  <div id="tip" class="tip" role="tooltip" hidden></div>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
