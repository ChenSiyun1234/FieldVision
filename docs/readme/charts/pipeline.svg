<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1090" width="1200" height="1090" role="img" aria-label="FieldVision pipeline: 9 stages orchestrated by a Nemotron supervisor. Ingest Sentinel-2, Landsat 8/9 and USDA field data; cloud check; classify with a 6-feature model trained on 8,000 EU fields; cloud-gap Bayes p(silage) = pi S / (pi S + (1 - pi) G); USDA-history prior p' = p pi / (p pi + (1 - p)(1 - pi)); RAG critic over QuickStats and NASS reports; Silage Match; report and decision checks; 5-day watch loop. Models: Nemotron 3.5 Lightning 30B-A3B, Nemotron 3 Ultra 550B-A55B, Nemotron 3.5 Super VL 120B-A12B, Nemotron 3.5 Bolt 74B-A9B.">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f8f5"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f6358"/></marker>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .in { animation: rise 1s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    </style>
  </defs>
  <rect width="1200" height="1090" rx="20" fill="url(#bg)" stroke="#dde7e1" stroke-width="1.5"/>
  <g class="in"><rect x="60" y="16" width="1125" height="64" rx="12" fill="#f3f8f5" stroke="#cfdcd4" stroke-width="1.5"/><circle cx="88" cy="48" r="14" fill="#f2c94c"/><text x="88" y="53" font-size="14" font-weight="800" fill="#13261c" text-anchor="middle">9</text><text x="112" y="54" font-size="16.5" font-weight="700" fill="#13261c">Watch loop</text><text x="220" y="54" font-size="13.5" fill="#13261c">checks for new Sentinel-2 scenes every 5 days and reruns the pipeline only when the estimate moves 1+ point</text><text x="1165" y="54" font-size="14" font-weight="700" fill="#1d6b47" text-anchor="end">agent ran 4×, not 21×</text></g>
  <rect x="60" y="96" width="1125" height="890" rx="16" fill="none" stroke="#c98f0c" stroke-opacity="0.7" stroke-dasharray="6 6"/>
  <text x="80" y="126" font-size="13" font-weight="700" fill="#1d6b47" letter-spacing="1.2">NEMOTRON SUPERVISOR  ·  REACT LOOP OVER 10 TOOLS  ·  CODE COMPUTES AND CHECKS EVERY NUMBER</text>
  <g class="in" style="animation-delay:0.10s"><rect x="80" y="146" width="330" height="320" rx="12" fill="url(#card)" stroke="#cfdcd4" stroke-width="1.5"/><circle cx="104" cy="171" r="14" fill="#f2c94c"/><text x="104" y="176" font-size="14" font-weight="800" fill="#13261c" text-anchor="middle">1</text><text x="127" y="177" font-size="16.5" font-weight="700" fill="#13261c">Ingest: data in</text><text x="96" y="208" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="110" y="208" font-size="13.5" fill="#13261c">Sentinel-2 L2A: 10 bands, every 5 days</text><text x="96" y="229" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="110" y="229" font-size="13.5" fill="#13261c">Landsat 8/9: fills the cloudy weeks</text><text x="96" y="250" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="110" y="250" font-size="13.5" fill="#13261c">USDA Crop Sequence Boundaries (fields)</text><text x="96" y="271" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="110" y="271" font-size="13.5" fill="#13261c">USDA Cropland Data Layer: where corn is</text><text x="96" y="292" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="110" y="292" font-size="13.5" fill="#13261c">EU declarations: 8,000 labelled fields</text><text x="96" y="313" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="110" y="313" font-size="13.5" fill="#13261c">USDA Beltsville: 44 labelled US fields</text><line x1="94" y1="430" x2="396" y2="430" stroke="#cfdcd4"/><text x="96" y="453" font-size="14" font-weight="700" fill="#1d6b47">Hidden fields 217 → 136 with Landsat</text></g>
  <g class="in" style="animation-delay:0.30s"><rect x="450" y="146" width="330" height="320" rx="12" fill="url(#card)" stroke="#cfdcd4" stroke-width="1.5"/><circle cx="474" cy="171" r="14" fill="#f2c94c"/><text x="474" y="176" font-size="14" font-weight="800" fill="#13261c" text-anchor="middle">2</text><text x="497" y="177" font-size="16.5" font-weight="700" fill="#13261c">Cloud check</text><text x="466" y="208" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="480" y="208" font-size="13.5" fill="#13261c">Needs 2 clear images that bracket the cut</text><text x="466" y="229" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="480" y="229" font-size="13.5" fill="#13261c">Bracket of 12 days or less → stage 3</text><text x="466" y="250" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="480" y="250" font-size="13.5" fill="#13261c">Cut hidden by cloud → stage 4</text><text x="466" y="271" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="480" y="271" font-size="13.5" fill="#13261c">Nothing seen → not judged, area reported</text><line x1="464" y1="430" x2="766" y2="430" stroke="#cfdcd4"/><text x="466" y="453" font-size="14" font-weight="700" fill="#1d6b47">Queen Anne's MD 22.4% → 4.0% (USDA 1.3%)</text></g>
  <g class="in" style="animation-delay:0.50s"><rect x="820" y="146" width="330" height="130" rx="12" fill="url(#card)" stroke="#cfdcd4" stroke-width="1.5"/><circle cx="844" cy="171" r="14" fill="#f2c94c"/><text x="844" y="176" font-size="14" font-weight="800" fill="#13261c" text-anchor="middle">3</text><text x="867" y="177" font-size="16.5" font-weight="700" fill="#13261c">Classify (seen fields)</text><text x="836" y="208" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="850" y="208" font-size="13.5" fill="#13261c">Class-balanced logistic regression</text><text x="836" y="229" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="850" y="229" font-size="13.5" fill="#13261c">6 features shaped by US signals</text><line x1="834" y1="240" x2="1136" y2="240" stroke="#cfdcd4"/><text x="836" y="263" font-size="14" font-weight="700" fill="#1d6b47">42 / 44 US fields right (95.5%)</text></g>
  <g class="in" style="animation-delay:0.60s"><rect x="820" y="286" width="330" height="180" rx="12" fill="url(#card)" stroke="#cfdcd4" stroke-width="1.5"/><circle cx="844" cy="311" r="14" fill="#f2c94c"/><text x="844" y="316" font-size="14" font-weight="800" fill="#13261c" text-anchor="middle">4</text><text x="867" y="317" font-size="16.5" font-weight="700" fill="#13261c">Cloud-gap Bayes (hidden fields)</text><rect x="834" y="332" width="302" height="30" rx="7" fill="#fdf6e0" stroke="#e8cf86"/><text x="985" y="352" font-size="14" font-weight="700" fill="#13261c" text-anchor="middle" style="font-family: Consolas, Menlo, 'DejaVu Sans Mono', monospace;">p(silage) = πS / (πS + (1−π)G)</text><text x="836" y="384" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="850" y="384" font-size="13.5" fill="#13261c">S, G: county silage, grain cut in the gap</text><text x="836" y="405" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="850" y="405" font-size="13.5" fill="#13261c">π: last official silage share</text><line x1="834" y1="430" x2="1136" y2="430" stroke="#cfdcd4"/><text x="836" y="453" font-size="14" font-weight="700" fill="#1d6b47">Wyoming NY miss 13.1 → 1.8 pts</text></g>
  <g class="in" style="animation-delay:0.80s"><rect x="820" y="506" width="330" height="200" rx="12" fill="url(#card)" stroke="#cfdcd4" stroke-width="1.5"/><circle cx="844" cy="531" r="14" fill="#f2c94c"/><text x="844" y="536" font-size="14" font-weight="800" fill="#13261c" text-anchor="middle">5</text><text x="867" y="537" font-size="16.5" font-weight="700" fill="#13261c">USDA-history prior</text><rect x="834" y="552" width="302" height="30" rx="7" fill="#fdf6e0" stroke="#e8cf86"/><text x="985" y="572" font-size="14" font-weight="700" fill="#13261c" text-anchor="middle" style="font-family: Consolas, Menlo, 'DejaVu Sans Mono', monospace;">p′ = pπ / (pπ + (1−p)(1−π))</text><text x="836" y="604" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="850" y="604" font-size="13.5" fill="#13261c">p: the model's silage probability</text><text x="836" y="625" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="850" y="625" font-size="13.5" fill="#13261c">π: state's USDA silage share, 2021-24</text><text x="836" y="646" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="850" y="646" font-size="13.5" fill="#13261c">Σ p′ × acres → county and state + range</text><line x1="834" y1="670" x2="1136" y2="670" stroke="#cfdcd4"/><text x="836" y="693" font-size="14" font-weight="700" fill="#1d6b47">TX, CA, CO gap 13.3 → 1.4 pts</text></g>
  <g class="in" style="animation-delay:1.00s"><rect x="450" y="506" width="330" height="200" rx="12" fill="url(#card)" stroke="#cfdcd4" stroke-width="1.5"/><circle cx="474" cy="531" r="14" fill="#f2c94c"/><text x="474" y="536" font-size="14" font-weight="800" fill="#13261c" text-anchor="middle">6</text><text x="497" y="537" font-size="16.5" font-weight="700" fill="#13261c">RAG critic</text><text x="466" y="568" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="480" y="568" font-size="13.5" fill="#13261c">USDA QuickStats: acres, 2012-2025</text><text x="466" y="589" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="480" y="589" font-size="13.5" fill="#13261c">NASS Crop Progress reports, 2021-2023</text><text x="466" y="610" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="480" y="610" font-size="13.5" fill="#13261c">Checks the county vs its history</text><text x="466" y="631" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="480" y="631" font-size="13.5" fill="#13261c">On fail: cites NASS passages, reruns</text><line x1="464" y1="670" x2="766" y2="670" stroke="#cfdcd4"/><text x="466" y="693" font-size="14" font-weight="700" fill="#1d6b47">Every flag comes with a source</text></g>
  <g class="in" style="animation-delay:1.20s"><rect x="80" y="506" width="330" height="200" rx="12" fill="url(#card)" stroke="#cfdcd4" stroke-width="1.5"/><circle cx="104" cy="531" r="14" fill="#f2c94c"/><text x="104" y="536" font-size="14" font-weight="800" fill="#13261c" text-anchor="middle">7</text><text x="127" y="537" font-size="16.5" font-weight="700" fill="#13261c">Silage Match</text><text x="96" y="568" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="110" y="568" font-size="13.5" fill="#13261c">Dairies: MD permits + EPA ECHO</text><text x="96" y="589" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="110" y="589" font-size="13.5" fill="#13261c">Min-cost flow, 20 road miles max</text><text x="96" y="610" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="110" y="610" font-size="13.5" fill="#13261c">Cost: haul distance + silage odds</text><line x1="94" y1="670" x2="396" y2="670" stroke="#cfdcd4"/><text x="96" y="693" font-size="14" font-weight="700" fill="#1d6b47">2,000 t from 3 fields within 1.6 mi</text></g>
  <g class="in" style="animation-delay:1.40s"><rect x="80" y="746" width="330" height="220" rx="12" fill="url(#card)" stroke="#cfdcd4" stroke-width="1.5"/><circle cx="104" cy="771" r="14" fill="#f2c94c"/><text x="104" y="776" font-size="14" font-weight="800" fill="#13261c" text-anchor="middle">8</text><text x="127" y="777" font-size="16.5" font-weight="700" fill="#13261c">Report + decision checks</text><text x="96" y="808" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="110" y="808" font-size="13.5" fill="#13261c">Fixed step order, one rerun</text><text x="96" y="829" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="110" y="829" font-size="13.5" fill="#13261c">Abstains instead of guessing</text><text x="96" y="850" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="110" y="850" font-size="13.5" fill="#13261c">Every LLM number checked in code</text><text x="96" y="871" font-size="13.5" fill="#1d6b47" font-weight="800">•</text><text x="110" y="871" font-size="13.5" fill="#13261c">Template fallback if a check fails</text><line x1="94" y1="930" x2="396" y2="930" stroke="#cfdcd4"/><text x="96" y="953" font-size="14" font-weight="700" fill="#1d6b47">0 unsupported numbers</text></g>
  <g class="in" style="animation-delay:1.6s"><rect x="450" y="746" width="700" height="220" rx="12" fill="url(#card)" stroke="#cfdcd4" stroke-width="1.5"/>
<text x="468" y="777" font-size="16.5" font-weight="700" fill="#13261c">NVIDIA Nemotron models</text><text x="686" y="777" font-size="13" fill="#4f6358">open mixture-of-experts, hybrid Mamba-Transformer</text>
<rect x="466" y="792" width="327" height="76" rx="9" fill="#ffffff" stroke="#cfdcd4"/><text x="480" y="815" font-size="14.5" font-weight="700" fill="#13261c">Nemotron 3.5 Lightning</text><text x="480" y="835" font-size="12.5" fill="#4f6358">30B total · 3B active · text</text><text x="480" y="855" font-size="13" font-weight="600" fill="#1d6b47">Supervisor: picks each tool · 15.3 s/county</text>
<rect x="807" y="792" width="327" height="76" rx="9" fill="#ffffff" stroke="#cfdcd4"/><text x="821" y="815" font-size="14.5" font-weight="700" fill="#13261c">Nemotron 3 Ultra</text><text x="821" y="835" font-size="12.5" fill="#4f6358">550B total · 55B active · 1M context</text><text x="821" y="855" font-size="13" font-weight="600" fill="#1d6b47">Critic verdict + report · 37.6 s/county</text>
<rect x="466" y="876" width="327" height="76" rx="9" fill="#ffffff" stroke="#cfdcd4"/><text x="480" y="899" font-size="14.5" font-weight="700" fill="#13261c">Nemotron 3.5 Super VL</text><text x="480" y="919" font-size="12.5" fill="#4f6358">120B total · 12B active · vision + text</text><text x="480" y="939" font-size="13" font-weight="600" fill="#1d6b47">Before/after field images · ~6 s/field</text>
<rect x="807" y="876" width="327" height="76" rx="9" fill="#ffffff" stroke="#cfdcd4"/><text x="821" y="899" font-size="14.5" font-weight="700" fill="#13261c">Nemotron 3.5 Bolt</text><text x="821" y="919" font-size="12.5" fill="#4f6358">74B total · 9B active · runs locally</text><text x="821" y="939" font-size="13" font-weight="600" fill="#1d6b47">Fast Q&amp;A, benchmarked · 6.9 s/county</text>
</g>
  <text x="80" y="1054" font-size="12.5" font-weight="700" fill="#1d6b47" letter-spacing="1.2">OUTPUTS</text>
  <g class="in" style="animation-delay:1.80s"><rect x="170" y="1032" width="154" height="36" rx="18" fill="#fdf6e0" stroke="#c98f0c" stroke-opacity="0.8"/><text x="247" y="1055" font-size="13.5" fill="#13261c" text-anchor="middle">Analyst dashboard</text></g>
  <g class="in" style="animation-delay:1.90s"><rect x="336" y="1032" width="125" height="36" rx="18" fill="#fdf6e0" stroke="#c98f0c" stroke-opacity="0.8"/><text x="399" y="1055" font-size="13.5" fill="#13261c" text-anchor="middle">County report</text></g>
  <g class="in" style="animation-delay:2.00s"><rect x="473" y="1032" width="191" height="36" rx="18" fill="#fdf6e0" stroke="#c98f0c" stroke-opacity="0.8"/><text x="568" y="1055" font-size="13.5" fill="#13261c" text-anchor="middle">US map, state to field</text></g>
  <g class="in" style="animation-delay:2.10s"><rect x="676" y="1032" width="147" height="36" rx="18" fill="#fdf6e0" stroke="#c98f0c" stroke-opacity="0.8"/><text x="749" y="1055" font-size="13.5" fill="#13261c" text-anchor="middle">Dairy silage map</text></g>
  <g class="in" style="animation-delay:2.20s"><rect x="834" y="1032" width="191" height="36" rx="18" fill="#fdf6e0" stroke="#c98f0c" stroke-opacity="0.8"/><text x="930" y="1055" font-size="13.5" fill="#13261c" text-anchor="middle">Price scenario 2026-28</text></g>
  <path d="M60,48 L36,48 L36,306 L76,306" fill="none" stroke="#4f6358" stroke-width="1.8" marker-end="url(#head)"/>
  <path d="M410,306 L446,306" fill="none" stroke="#4f6358" stroke-width="1.8" marker-end="url(#head)"/>
  <path d="M780,211 L816,211" fill="none" stroke="#4f6358" stroke-width="1.8" marker-end="url(#head)"/><text x="800" y="202" font-size="12" fill="#4f6358" text-anchor="middle" font-style="italic">seen</text>
  <path d="M780,376 L816,376" fill="none" stroke="#4f6358" stroke-width="1.8" marker-end="url(#head)"/><text x="800" y="367" font-size="12" fill="#4f6358" text-anchor="middle" font-style="italic">cloud</text>
  <path d="M1150,211 L1170,211 L1170,606 L1154,606" fill="none" stroke="#4f6358" stroke-width="1.8" marker-end="url(#head)"/>
  <path d="M985,466 L985,502" fill="none" stroke="#4f6358" stroke-width="1.8" marker-end="url(#head)"/>
  <path d="M820,596 L784,596" fill="none" stroke="#4f6358" stroke-width="1.8" marker-end="url(#head)"/>
  <path d="M700,506 C700,480 880,480 880,502" fill="none" stroke="#4f6358" stroke-width="1.8" marker-end="url(#head)"/><text x="790.0" y="480" font-size="12" fill="#4f6358" text-anchor="middle" font-style="italic">fail: rerun once</text>
  <path d="M450,596 L414,596" fill="none" stroke="#4f6358" stroke-width="1.8" marker-end="url(#head)"/><text x="430" y="587" font-size="12" fill="#4f6358" text-anchor="middle" font-style="italic">pass</text>
  <path d="M245,706 L245,742" fill="none" stroke="#4f6358" stroke-width="1.8" marker-end="url(#head)"/>
  <path d="M245,966 L245,1028" fill="none" stroke="#4f6358" stroke-width="1.8" marker-end="url(#head)"/>
  <circle r="6" fill="#e0a800" opacity="0.9"><animateMotion dur="9s" repeatCount="indefinite" path="M48,48 L36,48 L36,306 L245,306 L615,306 L985,211 L1170,211 L1170,606 L985,606 L615,596 L245,596 L245,856 L245,1050"/><animate attributeName="r" values="5;8;5" dur="1.2s" repeatCount="indefinite"/></circle>
</svg>
