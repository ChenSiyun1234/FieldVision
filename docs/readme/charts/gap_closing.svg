  <line x1="487.0" y1="250" x2="643.0" y2="250" stroke="#1d6b47" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>
  <circle cx="643.0" cy="250" r="6" fill="#ffffff" stroke="#7f8e86" stroke-width="2.5"/><text x="655.0" y="255" font-size="12.5" fill="#4f6358">8.1</text>
  <g style="animation: slide3 1.6s 0.75s ease-out both"><circle cx="487.0" cy="250" r="8" fill="#1d6b47" stroke="#ffffff" stroke-width="2"/><text x="473.0" y="255" font-size="12.5" font-weight="700" fill="#1d6b47" text-anchor="end">2.9</text></g>
  <style>@keyframes slide3 { from { transform: translateX(156.0px); } to { transform: none; } }</style>
  <text x="30" y="293" font-size="14" font-weight="700" fill="#13261c">Colorado 2025</text><text x="30" y="310" font-size="12" fill="#4f6358">USDA-history prior</text>
  <line x1="439.0" y1="296" x2="637.0" y2="296" stroke="#1d6b47" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>
  <circle cx="637.0" cy="296" r="6" fill="#ffffff" stroke="#7f8e86" stroke-width="2.5"/><text x="649.0" y="301" font-size="12.5" fill="#4f6358">7.9</text>
  <g style="animation: slide4 1.6s 0.90s ease-out both"><circle cx="439.0" cy="296" r="8" fill="#1d6b47" stroke="#ffffff" stroke-width="2"/><text x="425.0" y="301" font-size="12.5" font-weight="700" fill="#1d6b47" text-anchor="end">1.3</text></g>
  <style>@keyframes slide4 { from { transform: translateX(198.0px); } to { transform: none; } }</style>
  <text x="30" y="339" font-size="14" font-weight="700" fill="#13261c">Kent MD 2022</text><text x="30" y="356" font-size="12" fill="#4f6358">Landsat as second satellite</text>
  <line x1="454.0" y1="342" x2="622.0" y2="342" stroke="#1d6b47" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>
  <circle cx="622.0" cy="342" r="6" fill="#ffffff" stroke="#7f8e86" stroke-width="2.5"/><text x="634.0" y="347" font-size="12.5" fill="#4f6358">7.4</text>
  <g style="animation: slide5 1.6s 1.05s ease-out both"><circle cx="454.0" cy="342" r="8" fill="#1d6b47" stroke="#ffffff" stroke-width="2"/><text x="440.0" y="347" font-size="12.5" font-weight="700" fill="#1d6b47" text-anchor="end">1.8</text></g>
  <style>@keyframes slide5 { from { transform: translateX(168.0px); } to { transform: none; } }</style>
  <text x="30" y="385" font-size="14" font-weight="700" fill="#13261c">Frederick MD 2022</text><text x="30" y="402" font-size="12" fill="#4f6358">cloud-gap Bayes</text>
  <line x1="451.0" y1="388" x2="490.0" y2="388" stroke="#1d6b47" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>
  <circle cx="490.0" cy="388" r="6" fill="#ffffff" stroke="#7f8e86" stroke-width="2.5"/><text x="502.0" y="393" font-size="12.5" fill="#4f6358">3.0</text>
  <g style="animation: slide6 1.6s 1.20s ease-out both"><circle cx="451.0" cy="388" r="8" fill="#1d6b47" stroke="#ffffff" stroke-width="2"/><text x="437.0" y="393" font-size="12.5" font-weight="700" fill="#1d6b47" text-anchor="end">1.7</text></g>
  <style>@keyframes slide6 { from { transform: translateX(39.0px); } to { transform: none; } }</style>
  <text x="30" y="464" font-size="12" fill="#4f6358">These places were looked at while each method was built, so they show what the stage does, not a clean test. Clean tests are in the Results section.</text>
