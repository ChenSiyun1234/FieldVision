  <text x="30" y="201" font-size="14" font-weight="700" fill="#13261c">Wyoming County NY 2022</text><text x="30" y="218" font-size="12" fill="#4f6358">cloud-gap Bayes</text>
  <line x1="454.0" y1="204" x2="793.0" y2="204" stroke="#1d6b47" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>
