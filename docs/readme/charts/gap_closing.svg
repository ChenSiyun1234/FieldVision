  <style>@keyframes slide0 { from { transform: translateX(711.0px); } to { transform: none; } }</style>
  <text x="30" y="155" font-size="14" font-weight="700" fill="#13261c">Queen Anne's MD 2022</text><text x="30" y="172" font-size="12" fill="#4f6358">cloud check (seen fields only)</text>
