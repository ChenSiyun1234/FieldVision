<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 482" width="1200" height="482" role="img" aria-label="Before and after each stage, miss against USDA in points: Texas 2025 23.8 to 0.1; Queen Anne's MD 2022 21.1 to 2.7; Wyoming County NY 2022 13.1 to 1.8; California 2025 8.1 to 2.9; Colorado 2025 7.9 to 1.3; Kent MD 2022 7.4 to 1.8; Frederick MD 2022 3.0 to 1.7">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      
    </style>
  </defs>
  <rect width="1200" height="482" rx="20" fill="url(#bg)" stroke="#dde7e1" stroke-width="1.5"/>
  <text x="30" y="44" font-size="20" font-weight="800" fill="#13261c">The classifier alone was not enough</text>
  <text x="30" y="68" font-size="13" fill="#4f6358">Miss against USDA, in points of silage share. Each stage fixes one way the images mislead.</text>
  <circle cx="870" cy="52" r="6" fill="none" stroke="#7f8e86" stroke-width="2.5"/><text x="884" y="57" font-size="13" fill="#13261c">model alone</text>
  <circle cx="990" cy="52" r="7" fill="#1d6b47"/><text x="1004" y="57" font-size="13" fill="#13261c">with the stage</text>
  <line x1="400" y1="88" x2="400" y2="408" stroke="#13261c" stroke-opacity="0.08"/><text x="400" y="428" font-size="12" fill="#4f6358" text-anchor="middle">0</text>
  <line x1="550" y1="88" x2="550" y2="408" stroke="#13261c" stroke-opacity="0.08"/><text x="550" y="428" font-size="12" fill="#4f6358" text-anchor="middle">5</text>
  <line x1="700" y1="88" x2="700" y2="408" stroke="#13261c" stroke-opacity="0.08"/><text x="700" y="428" font-size="12" fill="#4f6358" text-anchor="middle">10</text>
  <line x1="850" y1="88" x2="850" y2="408" stroke="#13261c" stroke-opacity="0.08"/><text x="850" y="428" font-size="12" fill="#4f6358" text-anchor="middle">15</text>
  <line x1="1000" y1="88" x2="1000" y2="408" stroke="#13261c" stroke-opacity="0.08"/><text x="1000" y="428" font-size="12" fill="#4f6358" text-anchor="middle">20</text>
  <line x1="1150" y1="88" x2="1150" y2="408" stroke="#13261c" stroke-opacity="0.08"/><text x="1150" y="428" font-size="12" fill="#4f6358" text-anchor="middle">25</text>
  <text x="1150" y="448" font-size="12" fill="#4f6358" text-anchor="end">points from USDA</text>
  <text x="30" y="109" font-size="14" font-weight="700" fill="#13261c">Texas 2025</text><text x="30" y="126" font-size="12" fill="#4f6358">USDA-history prior</text>
  <line x1="403.0" y1="112" x2="1114.0" y2="112" stroke="#1d6b47" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>
