<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 464" width="1200" height="464" role="img" aria-label="Graded against USDA NASS 2025: Michigan 14.4% vs 14.7%; New York 48.7% vs 53.2%; Maryland 4.75% vs 8.9%; Wisconsin 16.6% vs 21.6%; Pennsylvania 15.2% vs 32.8%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .in { animation: rise 1s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    </style>
  </defs>
  <rect width="1200" height="464" rx="20" fill="url(#bg)" stroke="#dde7e1" stroke-width="1.5"/>
  <text x="30" y="44" font-size="20" font-weight="800" fill="#13261c">Graded against USDA NASS 2025</text>
  <text x="30" y="68" font-size="13" fill="#4f6358">Silage share of harvested corn, by state. Each state run once on 150 random blocks, under a rule logged before any 2025 imagery was scored.</text>
  <circle cx="760" cy="94" r="7" fill="#1d6b47"/><text x="774" y="99" font-size="13" fill="#13261c">FieldVision, with range</text>
  <path d="M945,86 L953,94 L945,102 L937,94 Z" fill="#c98f0c"/><text x="960" y="99" font-size="13" fill="#13261c">USDA NASS 2025</text>
  <text x="1170" y="98" font-size="12" font-weight="700" fill="#4f6358" text-anchor="end">GAP</text>
  <line x1="260" y1="106" x2="260" y2="372" stroke="#13261c" stroke-opacity="0.08"/><text x="260" y="390" font-size="12" fill="#4f6358" text-anchor="middle">0%</text>
  <line x1="385" y1="106" x2="385" y2="372" stroke="#13261c" stroke-opacity="0.08"/><text x="385" y="390" font-size="12" fill="#4f6358" text-anchor="middle">10%</text>
  <line x1="510" y1="106" x2="510" y2="372" stroke="#13261c" stroke-opacity="0.08"/><text x="510" y="390" font-size="12" fill="#4f6358" text-anchor="middle">20%</text>
  <line x1="635" y1="106" x2="635" y2="372" stroke="#13261c" stroke-opacity="0.08"/><text x="635" y="390" font-size="12" fill="#4f6358" text-anchor="middle">30%</text>
  <line x1="760" y1="106" x2="760" y2="372" stroke="#13261c" stroke-opacity="0.08"/><text x="760" y="390" font-size="12" fill="#4f6358" text-anchor="middle">40%</text>
  <line x1="885" y1="106" x2="885" y2="372" stroke="#13261c" stroke-opacity="0.08"/><text x="885" y="390" font-size="12" fill="#4f6358" text-anchor="middle">50%</text>
  <line x1="1010" y1="106" x2="1010" y2="372" stroke="#13261c" stroke-opacity="0.08"/><text x="1010" y="390" font-size="12" fill="#4f6358" text-anchor="middle">60%</text>
  <text x="30" y="125" font-size="15" font-weight="700" fill="#13261c">Michigan</text>
  <line x1="395.0" y1="120" x2="485.0" y2="120" stroke="#1d6b47" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round"/>
  <g class="in" style="animation-delay:0.20s"><circle cx="440.0" cy="120" r="8" fill="#1d6b47" stroke="#ffffff" stroke-width="2"/></g>
  <path d="M443.8,111 L452.8,120 L443.8,129 L434.8,120 Z" fill="#c98f0c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="499.0" y="125" font-size="12.5" fill="#4f6358">14.4% vs 14.7%</text>
  <text x="1170" y="125" font-size="14" font-weight="800" fill="#1d6b47" text-anchor="end">-0.3</text>
