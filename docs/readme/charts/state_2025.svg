  <path d="M530.0,273 L539.0,282 L530.0,291 L521.0,282 Z" fill="#c98f0c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="553.0" y="287" font-size="12.5" fill="#4f6358">16.6% vs 21.6%</text>
  <text x="1170" y="287" font-size="14" font-weight="800" fill="#1d6b47" text-anchor="end">-5.0</text>
  <text x="30" y="341" font-size="15" font-weight="700" fill="#13261c">Pennsylvania</text>
  <line x1="421.2" y1="336" x2="478.8" y2="336" stroke="#1d6b47" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round"/>
  <g class="in" style="animation-delay:0.80s"><circle cx="450.0" cy="336" r="8" fill="#1d6b47" stroke="#ffffff" stroke-width="2"/></g>
  <path d="M670.0,327 L679.0,336 L670.0,345 L661.0,336 Z" fill="#c98f0c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="693.0" y="341" font-size="12.5" fill="#4f6358">15.2% vs 32.8%</text>
  <text x="1170" y="341" font-size="14" font-weight="800" fill="#a4471b" text-anchor="end">-17.6</text>
  <text x="30" y="444" font-size="12" fill="#4f6358">4 of 5 within 5 points. Pennsylvania is the miss: northern silage cut after the crop yellows reads as grain. Maryland's method was set after its county runs.</text>
</svg>
