  <text x="951.5" y="179" font-size="12.5" fill="#4f6358">48.7% vs 53.2%</text>
  <text x="1170" y="179" font-size="14" font-weight="800" fill="#1d6b47" text-anchor="end">-4.5</text>
  <text x="30" y="233" font-size="15" font-weight="700" fill="#13261c">Maryland</text>
  <line x1="302.5" y1="228" x2="338.8" y2="228" stroke="#1d6b47" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round"/>
  <g class="in" style="animation-delay:0.50s"><circle cx="319.4" cy="228" r="8" fill="#1d6b47" stroke="#ffffff" stroke-width="2"/></g>
  <path d="M371.2,219 L380.2,228 L371.2,237 L362.2,228 Z" fill="#c98f0c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="394.2" y="233" font-size="12.5" fill="#4f6358">4.75% vs 8.9%</text>
  <text x="1170" y="233" font-size="14" font-weight="800" fill="#1d6b47" text-anchor="end">-4.2</text>
  <text x="30" y="287" font-size="15" font-weight="700" fill="#13261c">Wisconsin</text>
  <line x1="432.5" y1="282" x2="503.8" y2="282" stroke="#1d6b47" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round"/>
