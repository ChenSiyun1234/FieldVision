[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldvision"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["requests", "numpy", "pandas", "geopandas", "shapely>=2", "pyproj", "pyarrow", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
